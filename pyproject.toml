[project]
name = "csv-analyst"
version = "0.1.0"
description = "CSV 数据分析助手 - 使用自然语言对话分析 CSV 数据"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Raymon", email = "raymon@example.com" }
]
keywords = ["csv", "data-analysis", "llm", "pandas", "ai", "streamlit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pandas>=2.2.0",
    "openai>=2.8.1",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "streamlit>=1.50.0",
]

[tool.hatch.build.targets.wheel]
include = [
    "csv_analyst/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "csv_analyst/**",
    "README.md",
]

[project.scripts]
csv-analyst = "csv_analyst.app:run_app"
csv-demo-basic = "csv_analyst.basic_demo:main"
csv-demo-multi = "csv_analyst.multi_df_demo:main"
csv-demo-viz = "csv_analyst.visualization_demo:main"
csv-demo-quick = "csv_analyst.quick_demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
